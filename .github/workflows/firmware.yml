name: Build experimental RD03v2 firmware

on:
  workflow_dispatch:
  push:
    branches: [codex/low-memory]

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Source and startup checks
        run: |
          for script in build.sh tools/*.sh; do bash -n "$script"; done
          sh -n overlay/target/linux/qualcommax/ipq50xx/base-files/etc/init.d/yala-zram
          sh -n overlay/target/linux/qualcommax/ipq50xx/base-files/etc/init.d/yala-cpu-limit
          sh -n overlay/target/linux/qualcommax/ipq50xx/base-files/etc/uci-defaults/98-yala-profile
          python3 -m unittest discover -s tests -v

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 2G
      JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Define runner workspace paths
        run: |
          echo "RD03V2_WS=$RUNNER_TEMP/yala-ws" >> "$GITHUB_ENV"
          echo "TREE=$RUNNER_TEMP/yala-ws/openwrt-v2" >> "$GITHUB_ENV"
          echo "V2_KEY_DIR=$RUNNER_TEMP/yala-signing" >> "$GITHUB_ENV"
          echo "V2_DL=$RUNNER_TEMP/yala-cache/dl" >> "$GITHUB_ENV"
      - name: Free hosted-runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune -af
          df -h .
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq squashfs-tools device-tree-compiler u-boot-tools libelf-dev qemu-user ccache
      - name: Restore public download and compiler caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/yala-cache
          key: ${{ runner.os }}-rd03v2-${{ hashFiles('upstream.lock', 'feeds.lock', 'config/*.config', 'vendor/ucode/Makefile') }}
          restore-keys: ${{ runner.os }}-rd03v2-
      - name: Restore signing key without logging it
        env:
          APK_SIGNING_KEY: ${{ secrets.YALA_APK_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$APK_SIGNING_KEY"
          mkdir -p "$V2_KEY_DIR"
          printf '%s\n' "$APK_SIGNING_KEY" > "$V2_KEY_DIR/private-key.pem"
          openssl ec -in "$V2_KEY_DIR/private-key.pem" -pubout -out "$V2_KEY_DIR/public-key.pem" 2>/dev/null
          cmp "$V2_KEY_DIR/public-key.pem" keys/public-key.pem
      - name: Prepare build identity and independent image inspector
        run: |
          tag="DEV-yala-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "V2_REPO_URL=https://zwthys-cyber.github.io/openwrt-xiaomi-ax3000t-rd03v2/yala/$tag/packages.adb" >> "$GITHUB_ENV"
          git init ../xiaomi-openwrt-install
          git -C ../xiaomi-openwrt-install remote add origin https://github.com/ADCDS/xiaomi-openwrt-install.git
          git -C ../xiaomi-openwrt-install fetch --depth 1 origin 2ca24a165a54f11af98cdea1ba8f4fef69c97ec1
          git -C ../xiaomi-openwrt-install checkout --detach FETCH_HEAD
      - name: Compile pinned firmware and package set
        run: |
          ./build.sh &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            date -u '+Build progress %Y-%m-%d %H:%M:%S UTC'
            for log in feeds-update.log defconfig.log download.log build.log; do
              if [ -f "$TREE/$log" ]; then tail -n 3 "$TREE/$log"; fi
            done
            sleep 45
          done
          wait "$build_pid"
      - name: Assemble independently verified experimental artifacts
        run: |
          tools/mkrelease-v2.sh --local --expect-repo-url "$V2_REPO_URL" --out "$GITHUB_WORKSPACE/output" "$TREE"
          python3 tools/verify-yala-image.py "$TREE" "$GITHUB_WORKSPACE/output"
          cp docs/YALA-FIRMWARE.zh-CN.md output/INSTALL-NOTES.zh-CN.md
          cp keys/public-key.pem output/signing-public-key.pem
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          out = Path('output')
          files = sorted(p for p in out.iterdir() if p.is_file() and p.name != 'sha256sums.txt')
          text = ''.join(f'{hashlib.file_digest(p.open("rb"), "sha256").hexdigest()}  {p.name}\n' for p in files)
          (out / 'sha256sums.txt').write_text(text)
          PY
          tools/verify-v2.sh --release output --apk "$TREE/staging_dir/host/bin/apk"
      - name: Upload verified draft firmware (no publication or flashing)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: YALA-RD03v2-experimental-${{ github.run_number }}
          path: output/
          compression-level: 0
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RD03v2-build-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/yala-ws/openwrt-v2/*.log
            ${{ runner.temp }}/yala-ws/openwrt-v2/verify*.txt
            ${{ runner.temp }}/yala-ws/openwrt-v2/diffconfig.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$V2_KEY_DIR/private-key.pem" "$TREE/private-key.pem"
